<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Página no encontrada · Ollin-Tep Software</title>
    <link rel="icon" type="image/svg+xml" href="/resources/ollintep.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css?v=5.7">
</head>
<body>
    <div class="liquid-bg" aria-hidden="true">
        <span class="blob blob-1"></span>
        <span class="blob blob-2"></span>
        <span class="blob blob-3"></span>
    </div>
    <section class="hero">
        <div class="hero-content">
            <img src="/resources/ollintep.svg" alt="Ollin-Tep Software" width="72" height="69" class="block mx-auto mb-6">
            <canvas class="pajaro pajaro-404" data-pajaro aria-hidden="true"></canvas>
            <h1 data-glitch>Esta página no existe</h1>
            <p>Puede que el enlace esté mal escrito o que la página se haya movido.</p>
            <div class="hero-btns">
                <a href="/" class="m3-btn m3-btn-filled shadow-md"><span>Ir al inicio</span></a>
                <a href="https://activation.ollin-tep.com/descargar" class="m3-btn m3-btn-tonal"><span>Descargar CroHub</span></a>
            </div>
        </div>
    </section>
    <div class="ascii-banda" data-texto="404" data-color="#22e1f0" aria-hidden="true"></div>
    <script>
        // GitHub Pages sirve esta misma página para todos: se traduce aquí según la preferencia guardada o la del navegador
        try {
            var g = localStorage.getItem('ollintep-idioma');
            var l = g || (navigator.languages || [navigator.language]).map(function (x) { return (x || '').slice(0, 2); }).filter(function (x) { return x === 'es' || x === 'en'; })[0] || 'en';
            if (l === 'en') {
                document.documentElement.lang = 'en';
                document.title = 'Page not found · Ollin-Tep Software';
                document.querySelector('h1').textContent = 'This page does not exist';
                document.querySelector('.hero-content p').textContent = 'The link may be mistyped, or the page may have moved.';
                var b = document.querySelectorAll('.hero-btns a');
                b[0].href = '/en/'; b[0].firstElementChild.textContent = 'Go home';
                b[1].firstElementChild.textContent = 'Download CroHub';
                b[1].href = 'https://activation.ollin-tep.com/descargar?lang=en';
            }
        } catch (e) {}
    </script>
    <script src="/script/efectos.js?v=5.7"></script>
</body>
</html>
